name: Node.js CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Строку cache: 'npm' мы удалили
    # Если файлов проекта нет, npm ci тоже упадет, 
    # поэтому для пустого теста эти строки можно временно закомментировать символом #
    # - run: npm ci
    # - run: npm test --if-present